<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- 16-Bit Gradients & Filters -->
    <radialGradient id="cyberBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e1346"/>
      <stop offset="60%" stop-color="#0c0a21"/>
      <stop offset="100%" stop-color="#04030a"/>
    </radialGradient>
    <linearGradient id="goldPixel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="cyanBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="arcanePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="emeraldAura" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- 🛡️ LAYER 1: 16-BIT RETRO OBSIDIAN CREST BASE (STEPPED PIXEL CORNERS) -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- Dark Obsidian Shield Body -->
  <path d="
    M 80 32  H 432 
    V 300 
    L 416 332 L 400 364 L 368 404 L 320 444 L 256 480 L 192 444 L 144 404 L 112 364 L 96 332 L 80 300 
    Z" fill="url(#cyberBg)" stroke="#000000" stroke-width="8"/>

  <!-- Stepped Gold Pixel Outer Border -->
  <path d="
    M 92 44  H 420 
    V 296 
    L 404 328 L 388 356 L 356 396 L 312 432 L 256 466 L 200 432 L 156 396 L 124 356 L 108 328 L 92 296 
    Z" fill="none" stroke="url(#goldPixel)" stroke-width="12"/>

  <!-- Inner Dark Inset Bevel -->
  <path d="
    M 104 56  H 408 
    V 288 
    L 392 318 L 376 346 L 348 384 L 304 418 L 256 450 L 208 418 L 164 384 L 136 346 L 120 318 L 104 288 
    Z" fill="#090d1f" fill-opacity="0.8" stroke="#1e293b" stroke-width="4"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- 🔮 LAYER 2: SYNAPTIC CIRCUIT & MANA GRID (CYBER-MEDIEVAL) -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- Grid Matrix Dots -->
  <g fill="#312e81" opacity="0.35">
    <rect x="120" y="80" width="8" height="8"/><rect x="160" y="80" width="8" height="8"/><rect x="344" y="80" width="8" height="8"/><rect x="384" y="80" width="8" height="8"/>
    <rect x="120" y="120" width="8" height="8"/><rect x="384" y="120" width="8" height="8"/>
    <rect x="120" y="160" width="8" height="8"/><rect x="384" y="160" width="8" height="8"/>
    <rect x="140" y="200" width="8" height="8"/><rect x="364" y="200" width="8" height="8"/>
  </g>

  <!-- Glowing Cyan Synapse / Bus Traces -->
  <g fill="#0284c7" opacity="0.8">
    <!-- Left Synapse Branch -->
    <path d="M 140 180 H 180 V 140 H 220 V 148 H 188 V 188 H 140 Z"/>
    <rect x="132" y="176" width="12" height="12" fill="#38bdf8"/>
    <rect x="216" y="136" width="12" height="12" fill="#38bdf8"/>

    <!-- Right Synapse Branch -->
    <path d="M 372 180 H 332 V 140 H 292 V 148 H 324 V 188 H 372 Z"/>
    <rect x="368" y="176" width="12" height="12" fill="#38bdf8"/>
    <rect x="284" y="136" width="12" height="12" fill="#38bdf8"/>

    <!-- Bottom Data Feed -->
    <path d="M 252 380 V 430 H 260 V 380 Z" fill="#6366f1"/>
    <rect x="250" y="430" width="12" height="12" fill="#a5b4fc"/>
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- 🏰 LAYER 3: 16-BIT CASTLE RAMPARTS & ANVIL (THE GUILD FORGE) -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- Pixel Anvil Base -->
  <g transform="translate(0, 20)">
    <!-- Base Footing -->
    <rect x="180" y="320" width="152" height="16" fill="#1e293b" stroke="#000" stroke-width="4"/>
    <rect x="200" y="296" width="112" height="24" fill="#334155" stroke="#000" stroke-width="4"/>
    <!-- Anvil Horns & Body -->
    <rect x="160" y="272" width="192" height="24" fill="#475569" stroke="#000" stroke-width="4"/>
    <rect x="144" y="272" width="24" height="12" fill="#64748b"/>
    <!-- Heated Gold Core on Anvil Face -->
    <rect x="208" y="276" width="96" height="8" fill="#f59e0b"/>
    <rect x="224" y="278" width="64" height="4" fill="#fef08a"/>
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ⚔️ LAYER 4: 16-BIT MASTER RUNIC SWORD (CENTER ARTIFACT) -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- Glowing Holy Aura Behind Blade -->
  <rect x="244" y="60" width="24" height="230" fill="#38bdf8" opacity="0.25"/>

  <!-- Sword Blade (Pixel Stepped Tip) -->
  <!-- Tip -->
  <rect x="252" y="48" width="8" height="12" fill="#ffffff"/>
  <rect x="248" y="60" width="16" height="12" fill="#e0f2fe"/>
  <!-- Main Blade Body -->
  <rect x="244" y="72" width="24" height="170" fill="url(#cyanBlade)" stroke="#0f172a" stroke-width="4"/>
  <!-- Blade Fuller / Center Glow Spine -->
  <rect x="254" y="76" width="4" height="156" fill="#ffffff"/>
  <!-- Ancient Runic Sigils on Blade -->
  <rect x="252" y="104" width="8" height="8" fill="#fef08a"/>
  <rect x="252" y="132" width="8" height="8" fill="#fef08a"/>
  <rect x="252" y="160" width="8" height="8" fill="#fef08a"/>

  <!-- Crossguard (Stepped Medieval Gold Guard) -->
  <rect x="196" y="242" width="120" height="16" fill="url(#goldPixel)" stroke="#000" stroke-width="4"/>
  <!-- Guard Gem Wing Accents -->
  <rect x="184" y="234" width="16" height="24" fill="#b45309" stroke="#000" stroke-width="3"/>
  <rect x="188" y="238" width="8" height="16" fill="#fde047"/>
  <rect x="312" y="234" width="16" height="24" fill="#b45309" stroke="#000" stroke-width="3"/>
  <rect x="316" y="238" width="8" height="16" fill="#fde047"/>

  <!-- Center Crossguard Ruby / Synapse Core -->
  <rect x="246" y="238" width="20" height="24" fill="#e11d48" stroke="#000" stroke-width="3"/>
  <rect x="250" y="242" width="12" height="16" fill="#fb7185"/>
  <rect x="254" y="246" width="4" height="8" fill="#ffffff"/>

  <!-- Sword Grip / Hilt -->
  <rect x="250" y="258" width="12" height="32" fill="#78350f" stroke="#000" stroke-width="3"/>
  <rect x="252" y="264" width="8" height="4" fill="#d97706"/>
  <rect x="252" y="274" width="8" height="4" fill="#d97706"/>

  <!-- Golden Pommel with Emerald Eye -->
  <rect x="244" y="290" width="24" height="20" fill="url(#goldPixel)" stroke="#000" stroke-width="3"/>
  <rect x="250" y="294" width="12" height="12" fill="#10b981"/>
  <rect x="254" y="298" width="4" height="4" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- 👑 LAYER 5: 3 AGENT SYMBOLIC SIGILS (SAGE, FORGE, SENTINEL) -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- 1. LEFT: THE SAGE (ARCANE HEXAGON OF BLUEPRINT & LOGIC) -->
  <g transform="translate(144, 90)">
    <rect x="-24" y="-24" width="48" height="48" fill="#1e1b4b" stroke="#818cf8" stroke-width="4"/>
    <rect x="-16" y="-16" width="32" height="32" fill="#4338ca"/>
    <!-- Arcane Tome / Crystal Sigil -->
    <polygon points="0,-12 10,0 0,12 -10,0" fill="#a5b4fc"/>
    <rect x="-3" y="-3" width="6" height="6" fill="#ffffff"/>
    <!-- Label -->
    <rect x="-28" y="30" width="56" height="14" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <text x="0" y="41" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#c7d2fe" text-anchor="middle" letter-spacing="1">SAGE</text>
  </g>

  <!-- 2. CENTER-TOP: THE CROWN & NEURAL APEX -->
  <g transform="translate(256, 24)">
    <polygon points="0,-8 14,8 -14,8" fill="#f59e0b"/>
    <rect x="-8" y="8" width="16" height="8" fill="#d97706"/>
  </g>

  <!-- 3. RIGHT: THE SENTINEL (EMERALD ZERO-TRUST SHIELD) -->
  <g transform="translate(368, 90)">
    <rect x="-24" y="-24" width="48" height="48" fill="#064e3b" stroke="#34d399" stroke-width="4"/>
    <rect x="-16" y="-16" width="32" height="32" fill="#059669"/>
    <!-- Aegis Cross Sigil -->
    <rect x="-4" y="-12" width="8" height="24" fill="#a7f3d0"/>
    <rect x="-12" y="-4" width="24" height="8" fill="#a7f3d0"/>
    <rect x="-3" y="-3" width="6" height="6" fill="#ffffff"/>
    <!-- Label -->
    <rect x="-32" y="30" width="64" height="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="41" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">SENTINEL</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- 📜 LAYER 6: 16-BIT RETRO RIBBON BANNER & TYPOGRAPHY -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- Banner Shadow & Underlay -->
  <rect x="52" y="380" width="408" height="68" fill="#000000" stroke="#000" stroke-width="6"/>
  
  <!-- Banner Main Gold & Dark Navy Plate -->
  <rect x="56" y="376" width="400" height="64" fill="#0a0f24" stroke="url(#goldPixel)" stroke-width="6"/>
  <rect x="64" y="384" width="384" height="48" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Decorative Corner Pixel Studs on Banner -->
  <rect x="60" y="380" width="8" height="8" fill="#fde047"/>
  <rect x="444" y="380" width="8" height="8" fill="#fde047"/>
  <rect x="60" y="428" width="8" height="8" fill="#fde047"/>
  <rect x="444" y="428" width="8" height="8" fill="#fde047"/>

  <!-- Main Title: SYNAPSEGUILD (High-Contrast Crisp Retro Lettering) -->
  <text x="256" y="416" font-family="'Courier New', monospace" font-size="28" font-weight="900" fill="#fef08a" letter-spacing="4" text-anchor="middle">
    SYNAPSE<tspan fill="#38bdf8">GUILD</tspan>
  </text>

  <!-- Subtitle Badge: 16-BIT AUTONOMOUS AI ARENA -->
  <text x="256" y="430" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="2.5" text-anchor="middle">
    AUTONOMOUS AI MULTI-AGENT ARENA
  </text>

  <!-- Sparkle Stars / Pixel Glow Highlights -->
  <g fill="#ffffff">
    <!-- Star 1 (Top Left) -->
    <rect x="110" y="60" width="4" height="12"/><rect x="106" y="64" width="12" height="4"/>
    <!-- Star 2 (Top Right) -->
    <rect x="398" y="60" width="4" height="12"/><rect x="394" y="64" width="12" height="4"/>
    <!-- Star 3 (Blade Sparkle) -->
    <rect x="272" y="110" width="3" height="9" fill="#fef08a"/><rect x="269" y="113" width="9" height="3" fill="#fef08a"/>
  </g>
</svg>
