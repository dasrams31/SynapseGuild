<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#050814"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Background Shield Canvas -->
  <rect width="512" height="512" rx="64" fill="url(#bgGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="52" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="16 8"/>

  <!-- Pixel Castle Ramparts (Center Silhouette) -->
  <path d="M128 352h256v32H128zm0-128h48v32h-48zm80 0h48v32h-48zm80 0h48v32h-48zm-160 32h256v64H128z" fill="#1e293b"/>
  <path d="M160 288h192v64H160z" fill="#0f172a"/>
  <!-- Castle Gateway / Arch -->
  <path d="M224 304h64v80h-64z" fill="#f59e0b" opacity="0.9"/>
  <circle cx="256" cy="304" r="32" fill="#f59e0b" opacity="0.9"/>

  <!-- Crossed Legendary Swords (16-Bit Pixel Style) -->
  <!-- Left-to-Right Sword -->
  <g transform="translate(256,230) rotate(45) translate(-256,-230)">
    <!-- Blade -->
    <rect x="246" y="70" width="20" height="230" rx="4" fill="url(#bladeGrad)"/>
    <path d="M246 70l10-30 10 30z" fill="#e0f2fe"/>
    <!-- Guard & Hilt -->
    <rect x="216" y="300" width="80" height="16" rx="4" fill="url(#goldGrad)"/>
    <rect x="250" y="316" width="12" height="48" rx="2" fill="#78350f"/>
    <!-- Pommel -->
    <circle cx="256" cy="372" r="14" fill="url(#goldGrad)"/>
    <circle cx="256" cy="372" r="6" fill="#ef4444"/>
  </g>

  <!-- Right-to-Left Sword -->
  <g transform="translate(256,230) rotate(-45) translate(-256,-230)">
    <!-- Blade -->
    <rect x="246" y="70" width="20" height="230" rx="4" fill="url(#bladeGrad)"/>
    <path d="M246 70l10-30 10 30z" fill="#e0f2fe"/>
    <!-- Guard & Hilt -->
    <rect x="216" y="300" width="80" height="16" rx="4" fill="url(#goldGrad)"/>
    <rect x="250" y="316" width="12" height="48" rx="2" fill="#78350f"/>
    <!-- Pommel -->
    <circle cx="256" cy="372" r="14" fill="url(#goldGrad)"/>
    <circle cx="256" cy="372" r="6" fill="#10b981"/>
  </g>

  <!-- 3 Party Hero Orbs Floating Above -->
  <!-- Sage Orb (Arcane Blue) -->
  <circle cx="160" cy="140" r="28" fill="#4f46e5" stroke="#a5b4fc" stroke-width="4"/>
  <text x="160" y="148" font-family="'Courier New', monospace" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>

  <!-- Forge Master Orb (Flame Amber) -->
  <circle cx="256" cy="100" r="32" fill="#d97706" stroke="#fde047" stroke-width="4"/>
  <text x="256" y="109" font-family="'Courier New', monospace" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">F</text>

  <!-- Sentinel Orb (Emerald Shield) -->
  <circle cx="352" cy="140" r="28" fill="#059669" stroke="#6ee7b7" stroke-width="4"/>
  <text x="352" y="148" font-family="'Courier New', monospace" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">I</text>

  <!-- Banner & Title -->
  <rect x="64" y="416" width="384" height="54" rx="12" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4"/>
  <text x="256" y="452" font-family="'Courier New', monospace" font-size="24" font-weight="900" fill="#fde047" letter-spacing="4" text-anchor="middle">SYNAPSEGUILD</text>
</svg>
